<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>Message Sent | Bit-Miner</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/support-security.css">
  <style>
    .success-page {
      text-align: center;
      padding: 60px 20px 40px;
    }
    .success-icon {
      width: 90px;
      height: 90px;
      background: #ecfdf5;
      color: #059669;
      font-size: 48px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 24px;
    }
    .success-page h1 {
      font-size: 24px;
      margin-bottom: 12px;
    }
    .success-page p {
      color: #6b7280;
      font-size: 15px;
      line-height: 1.5;
      margin-bottom: 32px;
    }
    .success-actions {
      display: flex;
      flex-direction: column;
      gap: 12px;
      max-width: 280px;
      margin: 0 auto;
    }
  </style>
</head>
<body>
  <header class="header">
    <a href="profile.html" class="back">←</a>
    <span class="header-title">Support</span>
    <div class="header-actions"></div>
  </header>

  <main>
    <div class="success-page">
      <div class="success-icon">✓</div>
      <h1>Message Sent!</h1>
      <p>
        Thank you for contacting us.<br>
        Our support team has received your message and will reply as soon as possible.
      </p>

      <div class="success-actions">
        <a href="index.html" class="btn primary full">Back to Profile</a>
        <a href="support.html" class="btn" style="background:#f3f4f6;color:#111;text-align:center;padding:14px;border-radius:12px;text-decoration:none;font-weight:600;">Send Another Message</a>
      </div>
    </div>
  </main>

  <nav class="bottom">
    <a href="index.html"><span class="nav-icon">◉</span><span>Mining</span></a>
    <a href="buy.html"><span class="nav-icon">🛒</span><span>Buy</span></a>
    <a href="balance.html"><span class="nav-icon">▣</span><span>Balance</span></a>
    <a href="products.html"><span class="nav-icon">ⓒ</span><span>Products</span></a>
    <a href="profile.html" class="active"><span class="nav-icon">♙</span><span>Profile</span></a>
  </nav>
</body>
</html>
