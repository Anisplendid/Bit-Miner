<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Select Crypto | Bit-Miner</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="top">
    <a class="back" href="deposit.html">‹</a>
    <a class="brand">Select Crypto</a>
  </header>
  <main class="page">
    <div class="hero-mini">
      <span>PAYMENT METHOD</span>
      <h1>Select cryptocurrency</h1>
      <p>Choose the currency for your payment.</p>
    </div>

    <div class="amount-banner">
      <span>Deposit amount</span>
      <div class="amount-right">
        <strong id="displayAmount">$0.00</strong>
        <small id="displayEarnings">+$0.00 earn</small>
      </div>
    </div>

    <div class="crypto-grid">
      <button class="crypto-card" data-crypto="BTC">
        <span class="coin-icon">₿</span>
        <strong>Bitcoin</strong>
        <small>BTC</small>
      </button>

      <button class="crypto-card" data-crypto="TRX">
        <span class="coin-icon">TRX</span>
        <strong>TRON</strong>
        <small>TRX</small>
      </button>

      <button class="crypto-card" data-crypto="ETH">
        <span class="coin-icon">ETH</span>
        <strong>Ethereum</strong>
        <small>ETH</small>
      </button>

      <button class="crypto-card" data-crypto="SOL">
        <span class="coin-icon">SOL</span>
        <strong>Solana</strong>
        <small>SOL</small>
      </button>

      <button class="crypto-card" data-crypto="XRP">
        <span class="coin-icon">XRP</span>
        <strong>Xrp</strong>
        <small>XRP</small>
      </button>

      <button class="crypto-card" data-crypto="USDT">
        <span class="coin-icon">₮</span>
        <strong>Tether</strong>
        <small>USDT</small>
      </button>

    </div>
  </main>
  <script src="js/script.js"></script>
</body>
</html>
