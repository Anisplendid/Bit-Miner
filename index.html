<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <meta name="theme-color" content="#2c88df">
<link rel="icon" href="images/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="images/apple-touch-icon.svg">
<link rel="manifest" href="manifest.json">
  <title>Bit-Miner | Mining</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="top">
    <a class="brand" href="index.html">Bit-Miner</a>
    <div class="header-actions">⋮</div>
  </header>

  <main class="dashboard">
    <div class="page-title">
      <h1>Dashboard</h1>
      <span class="info">i</span>
    </div>

    <section class="promo">
      <div>
        <b>$80K unlocked</b>
        <p>BTC is heating up – time to turn up your hashrate</p>
      </div>
      <div class="coin">₿</div>
    </section>

    <section class="balance-card">
      <div class="asset">
        <span class="btc">₿</span>
        <div>
          <strong data-btc-amount>0.000001</strong>
          <small data-btc-usd>~ $0.07</small>
        </div>
        <b>›</b>
      </div>

      <div class="gauge-wrap">
        <div class="gauge">
          <div class="gauge-arc"></div>
          <div class="needle"></div>
          <div class="gauge-labels">
            <span class="g-label g-0">0</span>
            <span class="g-label g-5k">5K</span>
            <span class="g-label g-25k">25K</span>
            <span class="g-label g-50k">50K</span>
            <span class="g-label g-100k">100K</span>
            <span class="g-label g-250k">250K</span>
            <span class="g-label g-500k">500K</span>
            <span class="g-label g-1m">1M</span>
            <span class="g-label g-50m">50M</span>
          </div>
        </div>
      </div>

      <a class="mine-btn" href="deposit.html">Start mining</a>
    </section>

    <!-- Live Market Signal -->
    <section class="chart-card">
      <div class="price-row">
        <div>
          <div class="pair">BTC / USD</div>
        </div>
        <div>
          <div class="price" data-btc-price>79,673.35</div>
          <div class="change down" data-btc-change>↓ 1.6% 24H</div>
        </div>
      </div>
      <div class="chart-container"></div>
    </section>

     <section class="withdraw-card">
      
     </section>
  </main>

  <nav class="bottom">
    <a href="index.html" class="active">
      <span class="nav-icon">◉</span>
      <span>Mining</span>
    </a>
    <a href="buy.html">
      <span class="nav-icon">🛒</span>
      <span>Buy</span>
    </a>
    <a href="balance.html">
      <span class="nav-icon">▣</span>
      <span>Balance</span>
    </a>
    <a href="products.html">
      <span class="nav-icon">ⓒ</span>
      <span>Products</span>
    </a>
    <a href="profile.html">
      <span class="nav-icon">♙</span>
      <span>Profile</span>
    </a>
  </nav>

  <script src="js/script.js"></script>
  <script src="js/app.js"></script>


  
</body>
</html>
