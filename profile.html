<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>Bit-Miner | Profile</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="header">
    <a href="index.html" class="back">←</a>
    <span class="header-title">Profile</span>
    <div class="header-actions">⋮</div>
  </header>

  <main>
    <div class="profile-header">
      <div class="avatar">♙</div>
      <h2 style="font-size:20px">CT Miner</h2>
      <p style="color:#6b7280;font-size:14px;margin-top:4px">ID: 8872091 • Joined 2026</p>
    </div>

    <section class="card">
      <div class="list-item">
        <span>Account Balance</span>
        <strong data-btc-usd>~ $0.07</strong>
      </div>
      <div class="list-item">
        <span>BTC Holdings</span>
        <strong data-btc-amount data-suffix=" BTC">0.000001 BTC</strong>
      </div>
      <div class="list-item">
        <span>Total Mined</span>
        <strong data-btc-amount data-suffix=" BTC">0.000001 BTC</strong>
      </div>
      <div class="list-item">
        <span>Hashrate</span>
        <strong>12.5 TH/s</strong>
      </div>
    </section>

    <section class="card">
      <div class="list-item">
        <span>Security</span>
        <a href="security.html" style="text-decoration: none;" >
        <span style="color:#6b7280">›</span>
        </a>
      </div>
      <div class="list-item">
        <span>Notifications</span>
        <a href="buy.html" style="text-decoration: none;" >
        <span style="color:#6b7280">›</span>
        </a>
      </div>
      <div class="list-item">
        <span>Payment Methods</span>
        <a href="buy.html" style="text-decoration: none;" >
        <span style="color:#6b7280">›</span>
       </a>
      </div>
      <div class="list-item">
        <span>Support</span>
        <a href="support.html" style="text-decoration: none;" >
        <span style="color:#6b7280">›</span>
        </a>
      </div>
      <div class="list-item">
        <span>Logout</span>
        <a href="#buy.html" style="text-decoration: none;" >
        <span style="color:#ef4444">›</span>
        </a>
      </div>
    </section>

    <section class="chart-card">
      <div class="price-row">
        <div class="pair">Live BTC / USD</div>
        <div>
          <div class="price" data-btc-price style="font-size:16px">79,673.35</div>
          <div class="change down" data-btc-change>↓ 1.6% 24H</div>
        </div>
      </div>
      <div class="chart-container" style="height:80px"></div>
    </section>

     <section class="withdraw-card">

      
     </section>
  </main>

  <nav class="bottom">
    <a href="index.html">
      <span class="nav-icon">◉</span>
      <span>Mining</span>
    </a>
    <a href="buy.html">
      <span class="nav-icon">🛒</span>
      <span>Buy</span>
    </a>
    <a href="balance.html">
      <span class="nav-icon">▣</span>
      <span>Balance</span>
    </a>
    <a href="products.html">
      <span class="nav-icon">ⓒ</span>
      <span>Products</span>
    </a>
    <a href="profile.html" class="active">
      <span class="nav-icon">♙</span>
      <span>Profile</span>
    </a>
  </nav>

  <script src="js/script.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
